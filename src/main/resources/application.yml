spring:
  application:
    name: travelplanner

  profiles:
    # Local zero-setup experience. Production activates `postgres`, where demo seed is not enabled.
    default: demo-seed

  datasource:
    url: jdbc:h2:mem:travelplanner;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # Flyway owns DDL; Hibernate must fail startup if mappings and migrations drift apart.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true

  h2:
    console:
      enabled: false
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

travelplanner:
  h2:
    tcp:
      # Publishes the in-memory database on a loopback TCP port so IntelliJ / DataGrip / DBeaver can
      # browse it while the app runs. Development convenience only.
      enabled: false
      port: 9092
  jwt:
    # Local/test only. The postgres profile rejects this value; production must override it.
    secret: ${TRAVELPLANNER_JWT_SECRET:travel-planner-demo-secret-key-please-change-me-1234567890}
    ttl-hours: 12
    issuer: travelplanner-api
    audience: travelplanner-web
    allow-insecure-secret: true
  security:
    cors:
      # Exact local origins for this CRA frontend (3000) plus the optional Vite port (5173).
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    auth-rate-limit:
      requests: 10
      window-seconds: 60
  planner:
    day-start-hour: 9
    day-end-hour: 21
  google:
    # Set this (or GOOGLE_MAPS_API_KEY) to get real routes and durations from the Routes API for
    # every travel mode. When empty, routing falls back to OSRM below.
    api-key: ${GOOGLE_MAPS_API_KEY:}
    routes-base-url: https://routes.googleapis.com
  osrm:
    # Keyless real street routing, used when no Google key is set. The public demo server is a
    # courtesy service with no SLA — point this at your own OSRM for anything beyond development.
    enabled: true
    base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}

logging:
  structured:
    format:
      console: logstash
  level:
    org.hibernate.SQL: warn

---
# Production-shaped profile: PostgreSQL, same JPA code path.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travelplanner}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
travelplanner:
  jwt:
    allow-insecure-secret: false

---
# Demo catalog is opt-in outside the default local setup. Never add this profile in production.
spring:
  config:
    activate:
      on-profile: demo-seed
  h2:
    console:
      enabled: true
travelplanner:
  seed:
    enabled: true
  h2:
    tcp:
      enabled: true
