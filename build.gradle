plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}


group = 'com.laioffer'
version = '0.0.1-SNAPSHOT'
description = 'travelplanner'


java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}


repositories {
	mavenCentral()
}


dependencies {
	//implementation 'org.springframework.boot:spring-boot-starter-webmvc' // REST API
	implementation 'org.springframework.boot:spring-boot-starter-security' // Authentication
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // Database access
	implementation 'org.springframework.boot:spring-boot-starter-validation' // Request validation
	implementation 'org.springframework.boot:spring-boot-starter-cache' // Cache abstraction
	implementation 'com.github.ben-manes.caffeine:caffeine:3.+' // POI / travel-matrix cache

	implementation 'io.jsonwebtoken:jjwt-api:0.13.0' // JWT token generation
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	runtimeOnly 'com.h2database:h2' // Default dev database (zero setup)
	compileOnly 'com.h2database:h2' // org.h2.tools.Server, for the dev-only TCP inspection port
	// Spring Boot 4 moved the H2 web console into its own module. Without it, /h2-console is simply
	// not mapped and Spring Security answers 403.
	runtimeOnly 'org.springframework.boot:spring-boot-h2console'
	runtimeOnly 'org.postgresql:postgresql' // `postgres` profile

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
	useJUnitPlatform()
}
